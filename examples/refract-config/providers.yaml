# ~/.refract/providers.yaml  (copy to your $REFRACT_HOME, default ~/.refract)
#
# Registry of the providers (and their models) that pipelines can assign to agents.
# The key is the model-string prefix before "/". `library_path` points refract at the
# agent/type library.
#
# This fork executes every step through the Claude Code CLI, which authenticates from
# the subscription it is logged into — so a provider needs NO api_key_env at all, and
# the engine considers it available when the CLI is on PATH. Log in once with `claude`
# and nothing secret is stored here or anywhere else refract touches (I8).
#
# max_concurrent matters more than it would with an API key: a subscription is rate
# limited per ACCOUNT, so parallel steps compete with each other. Two is a sane
# default; raise it only if steps sit idle rather than get throttled.

providers:
  claude:
    max_concurrent: 2
    # CLI aliases (always the latest model of that tier) or exact model ids
    models: [sonnet, opus, haiku]

# An API key is still possible if you have one: declare api_key_env and the engine
# checks that variable instead of the CLI. The CLI picks the key up from the
# environment itself, so pipelines do not change.
#
#  anthropic-key:
#    api_key_env: ANTHROPIC_API_KEY
#    max_concurrent: 4
#    models: [claude-opus-5, claude-sonnet-5]

library_path: /absolute/path/to/refract-claude/library
