name: article_stylist
version: 1
description: >
  Style critic for Russian technical articles. Finds the mechanical defects of
  typography and terminology and the syntactic patterns characteristic of generated
  text, and proposes edits as before/after. Produces findings, never a rewrite: the
  author's voice is not rewritten silently, so every finding carries a `decision` a
  human sets before any editor touches the text.
consumes:
  - { port: article, type: article@v1 }
  # without the assignment a deliberate stylisation zone (an ironic aside on «ты» in a
  # text written as «вы») is indistinguishable from a defect — and the critic's own
  # rule is to report such a zone, not to count it as an error
  - { port: brief, type: brief@v1 }
produces:
  - { port: findings, type: style_findings@v1 }
# `read` carries the search tool, which is how the mechanical layer gets exact counts
# rather than estimates — a counted rule can become a gate later, a guessed one cannot
needs: [read, edit]
defaults:
  timeout_s: 3600
