name: source_finder
version: 1
description: >
  Finds and captures source material for a research brief: searches the web,
  reads what it finds, and saves each worthwhile source as its own file. The
  agent of a `discover` node (SPEC §20) — it writes ONE directory and the engine
  turns that directory into the source collection, so the agent never produces a
  collection itself (I6).
consumes:
  - { port: brief, type: brief@v1 }
produces:
  - { port: found, type: found_sources@v1 }
# pdf-reader is not an extra: official statistics, court-practice digests and agency
# reports are published as PDF, and a finder that cannot open one records the aspect as
# uncovered while looking at the document that covers it. A live run did exactly that
# twice — the two aspects it gave up on are the two the report then padded with remarks
# about its own source base.
needs: [read, edit, webfetch, "mcp:tavily-remote", "mcp:pdf-reader"]
defaults:
  timeout_s: 1800
