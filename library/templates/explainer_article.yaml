version: "0.1"
name: explainer_article

# Explainer mode: a technical article that TEACHES a mechanism, from a topic rather
# than a documents folder. Sources are found on the network and read, an analyst
# reconciles them, then a writer builds the article under a critic — with two
# correctors between them, because the things that break an explainer are not things a
# critic can fix. Arithmetic has to be run, and an attribution has to be looked up.
#
# After the content holds up, two more stages the report archetype does not have: a
# style critic that hunts machine-written patterns (its findings are PROPOSALS the
# human accepts or declines at a checkpoint — an author's voice is never rewritten
# silently), and an illustrator that fulfils the figure placeholders the article
# itself declared.
input_mode: brief

# The style stage parks the run: the stylist reports, the human decides. Editing the
# findings file in place IS the acceptance mechanism (SPEC §21) — no separate UI.
checkpoints: [style]

# What the run delivers, assembled into `runs/<id>/output/` when it completes (SPEC §22).
#
# The NAMES matter and are not the port names. The article declares its pictures as
# `![подпись](figures/<slug>.png)`, so the illustration directory has to arrive called
# `figures` next to `article.md` or every link in the delivered markdown is broken. Only
# the pipeline knows that promise — the illustrator's port is `illustration`, and the
# engine has no business guessing which of the two the artifact meant.
#
# `restyle.article` rather than `write.article`: the deliverable is the text after the
# accepted style edits, not the draft the loop handed over.
outputs:
  article: restyle.article
  figures: figures.illustration

nodes:
  - id: brief
    type: builtin/brief

  - id: find
    type: discover
    agent: source_finder@1
    inputs: { brief: brief.brief }
    # Lower than a report's floor on purpose, and lower than it looks like it should be.
    # An explainer needs the primary paper and a few real expositions; what it must NOT
    # do is invent the formula, so the sources that matter are the ones carrying
    # dimensions and scale.
    #
    # A high floor here backfires. The finder is capped against duplicates ("do not keep
    # two sources about the same thing unless they disagree"), and on a textbook subject
    # that cap binds long before a floor of a dozen does: there is one primary paper and
    # a pile of restatements of it. A live run demanded 12, the finder delivered 8 good
    # ones — every checklist point covered twice over — and the node failed on the
    # threshold. The floor must be what the article cannot do without, not an ambition.
    params: { min_sources: 6 }

  - id: study
    type: agent
    agent: study_extractor@1
    map: find.sources
    # the brief is broadcast to every item step: language and what counts as a fact
    # worth capturing come from the assignment
    inputs: { brief: brief.brief }
    # min_ok stays close to the shelf's size on purpose. A threshold far below it does
    # not protect the article, it hides the loss: a live run once reported `done` with
    # 18 notes taken from a shelf of 77, and which 18 survived was an accident of
    # scheduling order. It must also stay strictly under `min_sources` above — set them
    # equal and one unreadable page fails a node that had everything it needed.
    params: { workers: 3, min_ok: 5 }

  - id: analyse
    type: agent
    # Between reading and writing: reconciles what the sources agree on (the formula,
    # the role of each projection) and where they differ (notation, whether the scale
    # is explained as variance control or as a magnitude fix). Without this stage the
    # writer paraphrases whichever source it read last.
    #
    # A hollow aspect — an entry with neither findings nor a statement of why it has
    # none — is refused by `analysis@v1`'s own schema rather than by a rule here: the
    # artifact is JSON, so its emptiness is a schema question. Caught live twice, both
    # times comfortably above any floor on size.
    agent: domain_analyst@1
    inputs: { brief: brief.brief, notes: study.note }
    params: { model: claude/opus }

  - id: write
    type: loop
    # Four, not three, and the number comes from a measured run rather than taste. Three
    # rounds went 6 -> 2 -> 2 open items and the critic approved none of them: the loop was
    # still improving when the ceiling cut it off, and what shipped carried two remarks
    # nobody closed. A ceiling that stops a converging loop is the wrong ceiling for the
    # genre, and the plateau it is there to prevent is not what was happening.
    #
    # It stays a small number on purpose. This is not a budget to spend — `on_max_rounds:
    # pass` still lets an unapproved draft through, and the honest fix for a loop that
    # genuinely stalls is a plateau detector, not more rounds.
    params: { max_rounds: 4 }
    body:
      # A CHAIN, not one agent, and the order inside it is the order of what cannot be
      # judged by reading. The writer states the mechanism and works the example. The
      # verifier RECOMPUTES that example and corrects the numbers in place. The fact
      # checker opens the notes and makes every attributed claim match the note that
      # carries it. Only then does the critic see the draft.
      #
      # That shape was arrived at expensively. With a writer and a critic alone, the
      # critic can only REPORT what a corrector could have settled, and a report costs a
      # whole round: a live run spent all three of its rounds partly on an example whose
      # displayed sum did not add up (13.82562 where the three shown exponentials give
      # 11.10734) and on terms used before they were introduced. Anything a corrector can
      # close should never become a remark.
      #
      # Only the first element gets the critic's remarks (SPEC §10.3); the last
      # element's output is the round's draft, so the critic judges corrected text.
      - agent: article_writer@1
        model: claude/opus
        inputs:
          brief: brief.brief
          analysis: analyse.analysis
          notes: study.note
        # The gate sits on the WRITER, not on the last link of the chain: length and
        # dead phrases are the writer's to fix, and it is the writer that gets the gate
        # feedback on a retry. A ceiling enforced on the fact checker would ask the
        # wrong agent to cut prose it did not write.
        gate_rules:
          # Prose, not the file. The previous version of this template had to write its
          # ceiling as `max_length: 14000` for a brief asking 8–12 thousand — a number
          # padded to absorb markdown, tables and figure captions — and the critic still
          # spent a remark on length in every one of its three rounds, guessing 18–20k,
          # then 13k, then 13.5k for one and the same text. `prose_chars` counts what a
          # reader reads, and its failure message carries the arithmetic: how many
          # characters to remove. A round handed "you are over" as one item among sixteen
          # answered it by adding nine thousand characters of well-sourced material.
          - { rule: prose_chars, min: 8000, max: 12000 }
          # A heading with nothing under it. Under a length budget the temptation is to
          # empty a section rather than tighten it, and an empty section still satisfies
          # the article type's own structural regexes.
          - { rule: no_empty_sections }
          # Editorial policy as DATA. The lists live in library/style/forbid/ and are
          # edited by a person without touching this file; the same lists are what the
          # style critic reports on, so there is one description of the policy rather
          # than two that drift. A pattern a regex settles must never cost a round.
          - { rule: forbid_file, path: style/forbid/ru-slop.txt }
          - { rule: forbid_file, path: style/forbid/no-bold.txt }

      - agent: example_verifier@1
        model: claude/sonnet
        inputs:
          draft: "@prev"
          brief: brief.brief

      - agent: article_fact_checker@1
        # Attribution against notes is reading comprehension under pressure to leave
        # things alone, which is exactly where a weaker model invents corrections —
        # replacing a wrong attribution with a confident one is worse than the defect.
        model: claude/opus
        inputs:
          draft: "@prev"
          brief: brief.brief
          # the notes, not the analysis: checking an attribution against a summary of
          # the paper is how a wrong corpus name survives a correction stage
          notes: study.note

    critic:
      # Judges the mechanism, not the prose and no longer the citations: whether Q/K/V
      # roles are stated correctly, whether the scale is explained rather than asserted,
      # whether the example demonstrates what the text claims, whether every figure the
      # article promises is one a reader would need.
      #
      # It still receives the notes, because its contract requires them, but attribution
      # is no longer its job: the fact checker settles that inside the same round, and a
      # remark of the form "no note supports this" costs a round to fix while a corrector
      # closes it in place. The notes stay useful here for the mechanism itself — tracing
      # a dimension or a multiplier back to the paper that carries it.
      #
      # Dropping the ports outright would halve what the most expensive call of the round
      # reads, and it needs the agent contract changed rather than a port omitted here;
      # left for when the round's cost is measured on this pipeline rather than assumed.
      agent: article_critic@1
      model: claude/opus
      inputs:
        brief: brief.brief
        draft: "@body"
        analysis: analyse.analysis
        notes: study.note
    outputs: { article: "@body" }

  - id: style
    type: agent
    # The ported ru-style-critic, in REPORT mode. Produces findings, not a rewrite:
    # layer 1 is mechanical (dashes, quotes, calques, вы/ты) and layer 2 is the
    # machine-pattern hunt (impersonal passive, punctuation overload, three actors in
    # one sentence, "не X, а Y" chains, uniform sentence rhythm). Every finding
    # carries quote → reason → verdict → было/стало, and `decision: pending`.
    #
    # One critic, judging after the loop rather than inside it. Two critics in one round
    # take turns failing — substance ok / style revise, then the reverse — and each round
    # repairs one axis while disturbing the other; measured elsewhere at eleven rounds
    # without both ever passing together. Here the axes are separated in TIME: substance
    # converges first, then style is judged once, by a person's decision.
    agent: article_stylist@1
    inputs: { article: write.article, brief: brief.brief }
    # judging a whole article against narrow criteria is the work a weak model does
    # badly: it either invents findings to look busy or reports three and stops
    params: { model: claude/opus }

  - id: restyle
    type: agent
    # Applies ONLY the findings the human marked `accept` at the checkpoint above.
    # A rejected finding is not "applied anyway because it was probably right".
    agent: style_editor@1
    inputs:
      article: write.article
      findings: style.findings
    # applying a decided list is mechanical work — the cheap model is the right one
    params: { model: claude/sonnet }
    # What the editor must not leave behind. The same two policy files the writer was
    # held to: an editor that introduces a dead phrase while fixing a dash undoes the
    # gate that already passed. Typography beyond bold and the dash stays with the
    # stylist's report — a flat regex cannot tell prose from the python this article
    # carries, so `x = a - b` would read as a hyphen-for-dash.
    gate_rules:
      - { rule: forbid_file, path: style/forbid/ru-slop.txt }
      - { rule: forbid_file, path: style/forbid/no-bold.txt }
      # The ceiling again, because an editor applying two hundred edits can drift over
      # it. Measured on prose, as above; the floor is not repeated — the writer's loop
      # already cleared it and an editor does not add material.
      - { rule: prose_chars, max: 12000 }

  - id: figures
    type: agent
    # Fulfils the figure placeholders the article declared: for every
    # ![подпись](figures/<slug>.png) it runs the figgybanana CLI once and writes
    # output/illustration/<slug>.png. The drawing judgement (planner, stylist,
    # visualiser, vision critic) lives inside that tool — this step is execution,
    # which is why it will become a builtin node once builtins can consume an input.
    agent: illustrator@1
    inputs: { article: restyle.article }
    # Four diagrams through an external tool with its own refinement loop: generous.
    params: { timeout_s: 3600 }
    # The brief asks for four figures, so the step owes four files and the manifest. A
    # `dir` port is otherwise gated on non-emptiness alone — one figure out of four
    # would pass, and nothing in the run would say so. The node knows the number; it
    # states it.
    gate_rules:
      - { rule: min_entries, value: 5 }
