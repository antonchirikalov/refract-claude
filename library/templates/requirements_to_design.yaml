version: "0.1"
name: requirements_to_design

# Source documents to a solution design in one run, stopping in the middle so you can
# read the requirements — and fix them — before any design work starts.
checkpoints: [refine]

# WHAT THE RUN IS FOR (SPEC §22). Without this the two documents the pipeline exists to
# produce stay buried in `steps/<node>/_out/`, and a live run ended with an empty `output/`
# beside a run tree of 40 steps. The requirements go first because they are what the client
# signs; the design is what gets built from them.
outputs:
  requirements: refine.doc
  # the ILLUSTRATED design, not the draft the loop produced: the figures node returns the
  # same document with its placeholders filled, and that is what a person opens
  design: figures.document
  illustration: figures.illustration

nodes:
  # Why one pipeline instead of the separate `extract` + `solution_design` templates:
  # the design nodes read the requirements straight from the node that produced them,
  # so reuse works (`rerun --from design` recomputes nothing above it) and the chain
  # from sources to design keeps one run's provenance. Only comments ABOVE `nodes:`
  # become the gallery description (SPEC-UI §5.1), so this note stays out of the UI.

  - id: scan
    type: builtin/scanner

  - id: extract
    type: agent
    agent: source_processor@1
    map: scan.sources
    params: { workers: 3, min_ok: 1 }

  - id: refine
    type: loop
    params: { max_rounds: 3 }
    body:
      # A CHAIN: the writer states the requirements, then the fact checker walks them
      # against the extracts and hands back the same document with the claims corrected.
      #
      # The corrector is here rather than left to the critic for the reason the article
      # pipeline measured: a critic can only REPORT a number with no source behind it, and
      # reporting it costs a whole revision round, while a corrector settles it inside the
      # round it appeared in.
      #
      # With citations in every row the corrector's work becomes the most valuable in the
      # pipeline: each row names a source, each extraction carries that source's own words,
      # and a claim can therefore be held against the words. A citation pointing at a
      # source that says something else is the most expensive defect a requirements
      # document can carry, because it looks exactly like diligence.
      #
      # Only the first element gets the critic's remarks (SPEC §10.3); the last element's
      # output is the round's draft, so the critic judges corrected text.
      - agent: requirements_writer@1
        inputs: { extracts: extract.extract }
        # Depth and discrimination, which the artifact TYPE cannot judge. The type settles
        # shape — sections exist, identifiers are three digits, requirements sit in tables
        # with a source column. These settle whether the document is worth reviewing.
        #
        # A live run produced a competent-looking document with ten requirements and no
        # source on any of them, and both the type rules and the critic passed it. This is
        # the mechanical floor, so the critic spends its judgment on whether the citations
        # are TRUE rather than on whether they exist.
        #
        # Ten requirements is the standard's floor for a medium project; four subsections
        # means the areas were actually separated; a document that finds fewer than two
        # gaps in a set of client interviews has not looked. The last rule is the one a
        # reader spots first: if SHOULD and COULD never appear, every row is MUST and the
        # priority column carries no information at all.
        gate_rules:
        - { rule: min_matches, pattern: "(?m)^\\|\\s*FR-\\d{3}\\s*\\|", value: 10 }
        - { rule: min_matches, pattern: "(?m)^###\\s*3\\.\\d+\\s+\\S", value: 4 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*NFR-\\d{3}\\s*\\|", value: 3 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*BR-\\d{3}\\s*\\|", value: 2 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*G-\\d{3}\\s*\\|", value: 2 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*A-\\d{3}\\s*\\|", value: 2 }
        - { rule: regex, pattern: "\\|\\s*(SHOULD|COULD)\\s*\\|" }
      - agent: requirements_fact_checker@1
        inputs: { draft: "@prev", extracts: extract.extract }
        # The same floor on the corrector. Its job is to edit, and the cheapest way to
        # fail at editing is to rewrite: a retyped document loses whatever the editor had
        # no opinion about, and the loss is invisible because the result still reads as one
        # document. If a correction costs the document its structure, the gate says so here
        # rather than three nodes later.
        gate_rules:
        - { rule: min_matches, pattern: "(?m)^\\|\\s*FR-\\d{3}\\s*\\|", value: 10 }
        - { rule: min_matches, pattern: "(?m)^###\\s*3\\.\\d+\\s+\\S", value: 4 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*NFR-\\d{3}\\s*\\|", value: 3 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*BR-\\d{3}\\s*\\|", value: 2 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*G-\\d{3}\\s*\\|", value: 2 }
        - { rule: min_matches, pattern: "(?m)^\\|\\s*A-\\d{3}\\s*\\|", value: 2 }
        - { rule: regex, pattern: "\\|\\s*(SHOULD|COULD)\\s*\\|" }
    critic:
      agent: requirements_critic@1
      inputs: { draft: "@body", extracts: extract.extract }
    outputs: { doc: "@body" }

  - id: design
    type: agent
    agent: solution_designer@1
    inputs: { requirements: refine.doc }
    # see solution_design.yaml: only claude/* is reachable through the CLI runtime
    map_over: { models: ["claude/sonnet", "claude/opus"] }
    params: { workers: 2 }

  - id: choose
    type: select
    candidates: design.design_doc
    selector:
      agent: solution_design_selector@1
    params: { fallback: first_ok }

  - id: sd_refine
    type: loop
    params: { max_rounds: 2 }
    body:
      agent: solution_designer@1
      model: "@choose.winner_model"
      inputs: { requirements: refine.doc, draft: choose.out }
    critic:
      agent: solution_design_critic@1
      # the requirements come from three layers up: `inputs` references any node's
      # port, not just the previous node's (SPEC §8.1)
      inputs: { draft: "@body", requirements: refine.doc }
    outputs: { design: "@body" }

  - id: figures
    type: agent
    agent: design_illustrator@1
    inputs: { design: sd_refine.design }
    # The design declares its own figures as `<!-- ILLUSTRATION: <slug> -->` placeholders,
    # so this node has a contract to fulfil rather than a judgment to make: one figure per
    # placeholder, under the filename the placeholder named. It also returns the document
    # with the placeholders replaced by image references, which is why it comes last — the
    # deliverable is an illustrated design, not a design plus a folder of loose pictures.
    gate_rules:
      # The illustrated document must still be a design document, and it must no longer
      # carry work orders for figures that have been drawn. A live run of the article
      # pipeline shipped a document whose placeholders were never replaced, and nothing
      # noticed until a person opened it.
      # The PLACEHOLDER, not the word. A live run had the illustrator do everything right
      # and then explain itself in a note — "each marked with a tag of the form
      # `ILLUSTRATION: <slug>`" — and this rule failed the step three times over that
      # sentence. What must be gone is the work order: the HTML comment that opens one.
      - { rule: forbid_regex, pattern: '<!--\s*ILLUSTRATION:', max_hits: 0 }
      # The link must point at `illustration/` — the port name, and therefore the
              # directory name both in the step tree and in the delivery. A live run wrote
              # `illustrations/` (plural) and every image in the document was broken, in a
              # document that otherwise looked finished.
      - { rule: min_matches, pattern: '(?m)!\[[^\]]*\]\(illustration/', value: 1 }
      - { rule: forbid_regex, pattern: '\]\(illustrations/', max_hits: 0 }
