version: "0.1"
types:
  source@v1: { kind: any }
  extract@v1: { kind: file, format: json, schema: extract.schema.json }
  requirements@v1:
    kind: file
    format: markdown
    rules:
      # Anchored at the very start on purpose: a live run had the writer prepend a YAML
      # front-matter block with invented metadata (fr_count: 9 against ten FRs), which
      # the critic then had to argue about. The gate settles it mechanically.
      - { rule: regex, pattern: "\\A#\\s*Requirements:" }

      # --- the traceable structure (see library/agents/requirements_writer/prompt.md) ---
      #
      # These rules are the mechanical half of the document standard. They cannot judge
      # whether a citation is TRUE — that is the fact-checker's and the critic's work — but
      # they settle whether the document has the shape in which a citation can exist at
      # all. A live run produced a flat bulleted list with no sources anywhere and passed a
      # gate that only asked for the words "FR-" to appear somewhere.

      # Three digits, because IDs are permanent handles: `FR-1` and `FR-01` and `FR-001`
      # are three names for one requirement across a project's documents.
      - { rule: regex, pattern: "FR-\\d{3}" }

      # Requirements live in TABLES with a source column. A row is `| FR-001 | ... |`; a
      # bulleted list cannot carry ID, priority and source per requirement, and the source
      # per requirement is the whole point.
      - { rule: regex, pattern: "\\|\\s*FR-\\d{3}\\s*\\|" }

      # Grouped by business area, not one flat table. `### 3.1`, `### 3.2`, ...
      - { rule: regex, pattern: "(?m)^###\\s*3\\.\\d+\\s+\\S" }

      # Backtick-quoted source citations, the format the whole document is checked in.
      - { rule: regex, pattern: "(?m)\\|\\s*`[^`]+`[^|]*\\|\\s*$" }

      # The sections a reader needs and the writer keeps dropping. Each is present even
      # when the sources gave nothing for it — saying "no integrations are named in any
      # source" is a finding, a silently missing section is an oversight.
      - { rule: regex, pattern: "(?m)^##\\s*1\\.\\s" }
      - { rule: regex, pattern: "(?m)^##\\s*3\\.\\s" }
      - { rule: regex, pattern: "(?m)^##\\s*4\\.\\s" }
      - { rule: regex, pattern: "(?m)^##\\s*8\\.\\s" }
      # The three parts of section 8, separately: merged, they hide the useful one.
      - { rule: regex, pattern: "(?m)^###\\s*8\\.1\\s" }
      - { rule: regex, pattern: "(?m)^###\\s*8\\.2\\s" }
      - { rule: regex, pattern: "(?m)^###\\s*8\\.3\\s" }
      # Non-functional and business-rule identifiers, in table rows like the FRs.
      - { rule: regex, pattern: "\\|\\s*NFR-\\d{3}\\s*\\|" }
      - { rule: regex, pattern: "\\|\\s*BR-\\d{3}\\s*\\|" }
      # Gap and assumption identifiers: §8.2 and §8.3 exist to be filled, and an empty
      # heading is how "no open questions" gets asserted without being said.
      - { rule: regex, pattern: "\\|\\s*G-\\d{3}\\s*\\|" }
      - { rule: regex, pattern: "\\|\\s*A-\\d{3}\\s*\\|" }

      # No section left as a heading with nothing under it — the failure mode these rules
      # would otherwise invite, since a heading is cheaper than the content it promises.
      - { rule: no_empty_sections, min_chars: 40 }

  # A design with no rules passed the gate at three lines; SPEC §5's own example gives
  # design_doc a min_length. The regex is the mechanical half of "mark what you chose":
  # the section must exist, and the critic judges whether it is honest.
  design_doc@v1:
    kind: file
    format: markdown
    rules:
      - { rule: min_length, value: 2000 }

      # --- the committed-proposal structure (library/agents/solution_designer/prompt.md) ---
      #
      # The industry standard this follows is a client-facing technical proposal: one
      # architecture, no estimates, tables where the material is tabular, prose where it
      # teaches, and a figure wherever a diagram beats a paragraph. A live run produced a
      # document that read as a draft — bold text as emphasis, requirements restated rather
      # than answered — and passed a gate that asked only for length and two headings.

      # The five sections, numbered, in order.
      - { rule: regex, pattern: '(?m)^##\s*1\.\s' }
      - { rule: regex, pattern: '(?m)^##\s*2\.\s' }
      - { rule: regex, pattern: '(?m)^##\s*3\.\s' }
      - { rule: regex, pattern: '(?m)^##\s*4\.\s' }
      - { rule: regex, pattern: '(?m)^##\s*5\.\s' }
      # Section 1 is structured, not a flat prose block: context, architecture, the bet.
      - { rule: regex, pattern: '(?m)^###\s*1\.1\s' }
      - { rule: regex, pattern: '(?m)^###\s*1\.2\s' }
      - { rule: regex, pattern: '(?m)^###\s*1\.3\s' }
      - { rule: regex, pattern: '(?m)^###\s*2\.1\s' }
      # Phase 0 validates the architecture before any feature work; its absence is how a
      # proposal promises a design it never has to defend.
      - { rule: regex, pattern: '(?m)^###?\s*Phase\s*0' }

      # Tables where the material is tabular. Each of these is a row shape, so a document
      # that renders the same content as bullets fails here rather than in review.
      #   stakeholder rows carry a source; phase rows carry an exit criterion
      - { rule: min_matches, pattern: '(?m)^\|\s*\d+\s*\|', value: 8 }
      - { rule: regex, pattern: '(?m)^\|\s*(Phase|0|1)\s*\|' }
      # At least one figure placeholder: the architecture overview in 1.2 is mandatory.
      # The placeholder IS the deliverable at this stage — the illustrator fills it later.
      - { rule: regex, pattern: 'ILLUSTRATION:' }
      - { rule: regex, pattern: '(?m)^\*Figure\s+\d+\.' }
      # Assumptions and risks stay: a proposal that states neither has hidden both.
      - { rule: regex, pattern: '(?m)^#{2,3}[^\n]*([Aa]ssumption|[Дд]опущени)' }
      - { rule: regex, pattern: '(?m)^#{2,3}[^\n]*([Rr]isk|[Рр]иск)' }

      # --- what must NOT be there ---------------------------------------------------
      #
      # Bold as emphasis. The owner named this twice, and the standard makes it a finding:
      # bold reads as machine-generated and it is what a writer reaches for instead of
      # structure. Headings, tables and plain prose carry emphasis instead. Code literals
      # in backticks are unaffected — this matches on `**` only.
      - { rule: forbid_regex, pattern: '\*\*[^*\n]+\*\*', max_hits: 0 }
      # Estimates of any kind. A design document that quotes a duration or a price has
      # answered a question nobody asked it and created a commitment nobody costed. Phases
      # are bounded by what they deliver and by their exit criterion.
      - { rule: forbid_regex, pattern: '\b\d+\s*(?:man|person)[- ]?(?:day|week|month|hour)s?\b', flags: "i", max_hits: 0 }
      - { rule: forbid_regex, pattern: '\b(?:S/M/L|S,\s*M,\s*L|T-shirt siz)', flags: "i", max_hits: 0 }
      - { rule: forbid_regex, pattern: '\b\d+\s*story\s*points?\b', flags: "i", max_hits: 0 }
      # No heading left as a promise with nothing under it.
      - { rule: no_empty_sections, min_chars: 60 }

  # Research brief/topic: what a `discover` pipeline searches from (SPEC §20.4).
  brief@v1: { kind: file, format: markdown }
  # A discover agent's output: one file per found source (+ optional _index.json).
  # The ENGINE turns this dir into collection<source@v1> — the agent produces one
  # artifact, never a collection (I6 / SPEC §20.1).
  found_sources@v1: { kind: dir }
  discovery_report@v1: { kind: file, format: markdown }
  # Architecture-probe report: workshop-ready discovery questions grounded in
  # the source material (spectra arch_probe). Markdown document.
  arch_report@v1: { kind: file, format: markdown }
  # An explanatory technical article: teaches a mechanism to a reader who does not know
  # it yet. Genre floor only — the rules here say "this is an article", not "this
  # article is finished".
  #
  # Deliberately NOT here: the typographic and calque checks. They belong to the node
  # that runs after the stylist (`gate_rules` with `forbid_regex`), because a writer's
  # first draft legitimately still has them — a type-level ban would fail every round
  # of the writing loop for a defect the pipeline fixes two nodes later.
  article@v1:
    kind: file
    format: markdown
    rules:
      # anchored at the very start: front matter with invented metadata is a defect a
      # gate settles, not something a critic should spend a round arguing about
      - { rule: regex, pattern: "\\A#\\s+\\S" }
      # a figure the article promises is a contract with the illustrator: the drawing
      # step fulfils exactly these placeholders, by slug
      - { rule: regex, pattern: '!\[[^\]]*\]\(figures/[a-z0-9-]+\.png\)' }
      # genre floor: an explainer that fits in two screens has not explained anything.
      # What a given assignment needs is the brief's business (`gate_rules` on the node)
      - { rule: min_length, value: 6000 }
  # A style critic's findings over one article: mechanical layer (dashes, quotes, forms
  # of address, calques, term drift) and machine-pattern layer (impersonal passive,
  # punctuation overload, three actors in one sentence, "не X, а Y" chains, uniform
  # rhythm). Each finding carries quote → reason → before/after and a `decision` the
  # human sets at the checkpoint: the author's voice is never rewritten silently.
  style_findings@v1:
    kind: file
    format: json
    schema: style_findings.schema.json
  # Generated publication illustrations + a manifest recording each figure's caption
  # and the exact command that produced it, so any figure can be regenerated.
  illustration@v1: { kind: dir }
  # Publish confirmation: page URL/id/version, attachment counts (spectra confluence_publisher).
  publication@v1: { kind: file, format: json }
  # Academic reading note on one source, carrying the DSTU 8302:2015 bibliographic
  # data the report's source list is built from.
  study_note@v1: { kind: file, format: json, schema: study_note.schema.json }
  # Subject-matter analysis over the whole set of study notes, organised by the
  # brief's aspects. The stage a live run did without: with reading feeding prose
  # directly, nobody compared the sources, so the only thing left to write about
  # at length was the sources themselves — 45 pages characterising the shelf.
  analysis@v1: { kind: file, format: json, schema: analysis.schema.json }
  # Scientific-analytical report (Ukrainian). The volume requirement is a client
  # term, not a style preference, so it is enforced mechanically rather than left
  # to the critic to argue about: 45 pages x 1800 characters = 81 000.
  # The genre, not one assignment: a sourced analytic report. Headings are matched
  # as alternations so the type is not tied to a single language — the document's
  # own language comes from the brief and the agent's prompt, not from here.
  analytic_report@v1:
    kind: file
    format: markdown
    rules:
      - { rule: regex, pattern: '^#{1,2}\s*(ВСТУП|ВВЕДЕНИЕ|INTRODUCTION)', flags: "mi" }
      - { rule: regex, pattern: '^#{1,2}\s*(ВИСНОВКИ|ВЫВОДЫ|CONCLUSIONS?)', flags: "mi" }
      # No source list means no verifiable claims; the critic then judges whether
      # the entries are real and whether the in-text references match them.
      - rule: regex
        pattern: '^#{1,2}\s*(СПИСОК ВИКОРИСТАНИХ ДЖЕРЕЛ|СПИСОК ЛИТЕРАТУРЫ|REFERENCES|BIBLIOGRAPHY)'
        flags: "mi"
      # A reference to a source that is not in the list, and an entry nobody cites,
      # are both countable — settled here so no review round is spent on them. The
      # 40-character floor is what killed "Kurt v. Turkey (1998)." in a live run:
      # a title alone leads no reader back to the source.
      - rule: citation_closure
        list_heading: СПИСОК ВИКОРИСТАНИХ ДЖЕРЕЛ|СПИСОК ЛИТЕРАТУРЫ|REFERENCES|BIBLIOGRAPHY
        min_entry_chars: 40
      # Genre floor only — a report is not a memo. The volume a given assignment
      # demands is the brief's business, and the engine cannot yet enforce a
      # per-project number (see min_length note below).
      - { rule: min_length, value: 20000 }
