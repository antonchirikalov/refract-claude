<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470"
     role="img" aria-label="Выдача прогона: след работы в steps, объявленный результат в output">
  <style>
    .bg    { fill: #fbfaf7; }
    .trace { fill: #f4f2ee; stroke: #cfcbc2; stroke-width: 2; }
    .out   { fill: #eef6ef; stroke: #7aa886; stroke-width: 2.5; }
    .h     { font: 600 26px "Segoe UI", system-ui, "DejaVu Sans", sans-serif; fill: #1f1e1b; }
    .cap   { font: 600 18px "Segoe UI", system-ui, "DejaVu Sans", sans-serif; fill: #1f1e1b; }
    .sub   { font: 14px "Segoe UI", system-ui, "DejaVu Sans", sans-serif; fill: #5f5b53; }
    .note  { font: 14px "Segoe UI", system-ui, "DejaVu Sans", sans-serif; fill: #6b6257; }
    .path  { font: 13px ui-monospace, Consolas, monospace; fill: #4a463f; }
    .yaml  { font: 13px ui-monospace, Consolas, monospace; fill: #2f4f3a; }
    .arrow { stroke: #7aa886; stroke-width: 2.5; fill: none; marker-end: url(#g); }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa886"/></marker>
  </defs>

  <rect class="bg" width="1240" height="470"/>
  <text class="h" x="40" y="46">Дерево шагов — след работы. Результат объявляет описание</text>

  <!-- trace -->
  <rect class="trace" x="40" y="78" width="410" height="252" rx="10"/>
  <text class="cap"  x="62" y="110">steps/ — след</text>
  <text class="sub"  x="62" y="132">чем разбирают прогон</text>
  <text class="path" x="62" y="168">write/body1_r1/prompt.md</text>
  <text class="path" x="62" y="190">write/body1_r1/raw.txt</text>
  <text class="path" x="62" y="212">write/body1_r1/attempts/1/</text>
  <text class="path" x="62" y="234">restyle/main/output/article.md</text>
  <text class="path" x="62" y="256">figures/main/output/illustration/</text>
  <text class="note" x="62" y="292">статья здесь, картинки —</text>
  <text class="note" x="62" y="314">тремя каталогами в стороне</text>

  <!-- declaration -->
  <text class="cap"  x="510" y="110">outputs в описании</text>
  <text class="yaml" x="510" y="142">outputs:</text>
  <text class="yaml" x="510" y="164">  article: restyle.article</text>
  <text class="yaml" x="510" y="186">  figures: figures.illustration</text>
  <text class="note" x="510" y="222">имя в выдаче задаёт КЛЮЧ,</text>
  <text class="note" x="510" y="244">а не имя порта</text>
  <text class="note" x="510" y="272">движок собирает,</text>
  <text class="note" x="510" y="294">когда прогон завершён</text>
  <path class="arrow" d="M 512 316 H 856"/>

  <!-- output -->
  <rect class="out" x="880" y="78" width="320" height="252" rx="10"/>
  <text class="cap"  x="904" y="110">output/ — выдача</text>
  <text class="sub"  x="904" y="132">то, за чем запускали</text>
  <text class="path" x="904" y="172">article.md</text>
  <text class="path" x="904" y="196">figures/</text>
  <text class="path" x="924" y="220">x-to-qkv.png</text>
  <text class="path" x="924" y="244">scores-heatmap.png</text>
  <text class="path" x="924" y="268">manifest.json</text>
  <text class="note" x="904" y="304">ссылки в markdown живые</text>

  <!-- footer notes, full width -->
  <text class="note" x="40" y="382">Статья зовёт свои картинки «figures», а порт иллюстратора называется «illustration».</text>
  <text class="note" x="40" y="406">Какое из двух имён обещал артефакт — знает конвейер, а не движок: поэтому имя задаёт ключ.</text>
  <text class="note" x="40" y="436">Сборка идёт целиком заново. Недостающий артефакт — предупреждение в журнал, а не тишина.</text>
</svg>
