[project]
name = "refract"
version = "0.1.0"
description = "Declarative agent pipeline engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.18",
  "typer>=0.12",
  "jinja2>=3.1",
  "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]   # phase 2 ([standard] → WS)
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10",
  "types-PyYAML>=6", "types-jsonschema>=4",
  "httpx>=0.27",          # fastapi.testclient needs it; the engine itself does not
]

[project.scripts]
refract = "refract.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refract"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
